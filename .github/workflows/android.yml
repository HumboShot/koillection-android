name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running upload. A newer push waits for it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

  publish:
    # Only commits on main go to Google Play. Pull requests only run the check.
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Write the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The UPLOAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-key.jks
          {
            echo "storeFile=upload-key.jks"
            echo "storePassword=$UPLOAD_STORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > keystore.properties

      - name: Build the app bundle
        env:
          # Each run gets a higher versionCode. The offset keeps it above the versions uploaded by hand.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || '100' }}
        run: ./gradlew bundleRelease -PversionCode=$((VERSION_CODE + VERSION_CODE_OFFSET)) --console=plain

      - name: Upload to the internal track
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.humboshot.koillection
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          # Use "draft" until the app has one release that Google has reviewed.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Remove the upload key
        if: always()
        run: rm -f upload-key.jks keystore.properties
